[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetnet-sim"
version = "0.1.0"
description = "FleetNet multi-robot simulation & telemetry layer (drives the real Fleet_SIH algorithms over generated warehouse_layout layouts)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "shapely>=2.0",
    "networkx>=3.2",
    "pydantic>=2.4",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "fleetnet-layout @ file:./warehouse_layout",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "scikit-learn>=1.4", "httpx>=0.27"]
ml = ["scikit-learn>=1.4"]
zenoh = ["eclipse-zenoh==1.10.0"]

[tool.setuptools.packages.find]
include = ["fleetnet_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
